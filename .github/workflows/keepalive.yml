name: Keep the schedule alive

# GitHub silently DISABLES scheduled workflows on a repo with no activity for 60 days.
# For an alerting system that is a time bomb: everything works, then one day the alerts
# just stop. An empty commit twice a month keeps the repo active forever.
on:
  schedule:
    - cron: '17 3 1,15 * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Empty commit
        run: |
          git config user.name "keepalive"
          git config user.email "keepalive@users.noreply.github.com"
          git commit --allow-empty -m "keepalive: $(date -u +%Y-%m-%d) — keeps the speed-to-lead schedule enabled"
          git push
