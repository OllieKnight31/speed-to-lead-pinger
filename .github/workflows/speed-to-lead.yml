name: Deal Engine — speed-to-lead check

# WHY THIS IS A LOOP AND NOT JUST A CRON
# GitHub's `schedule` trigger is best-effort. On this repo a `*/5` cron went live and did
# not fire ONCE in its first two hours. A 5-minute speed-to-lead alert cannot hang off that.
# So the cadence lives INSIDE the job: check, sleep 5 min, repeat for ~55 min, then dispatch
# the next run ourselves. The cron below is only a restarter in case the chain ever breaks,
# and Vercel's daily cron is the backstop behind that. `concurrency` guarantees a single
# live loop however many triggers pile up.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      checks:   { description: 'checks per run (default 11 ≈ 55 min)', default: '11' }
      interval: { description: 'seconds between checks (default 300)',  default: '300' }

concurrency:
  group: speed-to-lead-loop
  cancel-in-progress: false

permissions:
  actions: write        # lets the run dispatch its successor

jobs:
  escalate:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Check every 5 minutes for leads that have not been dialled
        env:
          URL: ${{ secrets.RELAY_ESCALATE_URL }}
          KEY: ${{ secrets.ESCALATE_SECRET }}
          ALERT: ${{ secrets.SLACK_ALERT_WEBHOOK }}
          # The alarm goes to #5-ops-alerts by bot token, so it lands with every other
          # automation failure instead of wherever a webhook happened to be minted for.
          # The webhook above is only the fallback if the bot post is rejected.
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          ALERT_CHANNEL: C0C2TKXLV6W
          CHECKS: ${{ inputs.checks || '11' }}
          INTERVAL: ${{ inputs.interval || '300' }}
        run: |
          fails=0; alarmed=0
          for i in $(seq 1 "$CHECKS"); do
            code=$(curl -s -o /tmp/out.json -w '%{http_code}' -X POST "$URL" \
              -H "Authorization: Bearer $KEY" --retry 2 --retry-delay 5 --max-time 40)
            echo "[$(date -u +%H:%M:%S)] check $i/$CHECKS -> HTTP $code $(head -c 300 /tmp/out.json)"
            if [ "$code" = "200" ]; then fails=0; else fails=$((fails+1)); fi
            # Three misses in a row = the monitor itself is broken. Say so once per run —
            # otherwise alerts simply stop and nobody knows.
            if [ "$fails" -ge 3 ] && [ "$alarmed" = "0" ]; then
              MSG='🚨 <@U0C1G6P32BG> <@U0C0TPJG4TT> *The speed-to-lead monitor is failing.* Un-dialled leads are NOT being alerted right now. https://github.com/OllieKnight31/speed-to-lead-pinger/actions'
              sent=0
              if [ -n "$SLACK_BOT_TOKEN" ]; then
                ok=$(curl -s -X POST https://slack.com/api/chat.postMessage \
                  -H "Authorization: Bearer $SLACK_BOT_TOKEN" -H 'Content-Type: application/json; charset=utf-8' \
                  -d "{\"channel\":\"$ALERT_CHANNEL\",\"username\":\"Deal Engine\",\"icon_emoji\":\":house:\",\"text\":\"$MSG\"}" \
                  | grep -o '"ok":true' || true)
                [ -n "$ok" ] && sent=1
              fi
              if [ "$sent" = "0" ] && [ -n "$ALERT" ]; then
                curl -s -X POST "$ALERT" -H 'Content-Type: application/json' -d "{\"text\":\"$MSG\"}" >/dev/null
                sent=1
              fi
              [ "$sent" = "0" ] && echo "::error::monitor failing AND no way to alarm - no SLACK_BOT_TOKEN, no SLACK_ALERT_WEBHOOK"
              alarmed=1
            fi
            if [ "$i" -lt "$CHECKS" ]; then sleep "$INTERVAL"; fi
          done
          # `[ … ] && sleep` as the loop's last command returned 1 on the final pass and
          # marked every healthy run as failed. Be explicit: red only if the checks were failing.
          if [ "$fails" -ge 3 ]; then echo "::error::escalate endpoint failing"; exit 1; fi
          exit 0

      # Hand off after success OR failure, but never after a cancel: a human cancelling a run
      # must be able to stop the chain. If GitHub itself kills a run, the */15 cron restarts it.
      - name: Hand off to the next run
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run speed-to-lead.yml --repo "$GITHUB_REPOSITORY" --ref main
